# SPDX-License-Identifier: BUSL-1.1
#
# Builds the program the way it is deployed: with solana-verify, inside the Solana Foundation's
# verifiable-build Docker image for the Agave version in Cargo.toml ([workspace.metadata.cli]).
# Anyone who runs the same command on the same commit gets the same bytes, so the hash printed
# here can be compared with the program on chain (`solana-verify get-program-hash`) and with the
# auditors' own build of the tagged commit. docs/deployment.md has the whole procedure.
#
# Runs on version tags, on pushes to main that touch the program, and by hand. On a tag it also
# checks that the tag matches the crate version.
name: verified build

on:
  push:
    tags: [ "v*" ]
    branches: [ main ]
    paths:
      - "programs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/verified-build.yml"
  workflow_dispatch:

env:
  SOLANA_VERIFY_VERSION: "0.5.2"

jobs:
  build:
    name: solana-verify build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-${{ env.SOLANA_VERIFY_VERSION }}
      - name: Install solana-verify
        run: |
          if [ "$(solana-verify --version 2>/dev/null)" != "solana-verify ${SOLANA_VERIFY_VERSION}" ]; then
            cargo install solana-verify --version "${SOLANA_VERIFY_VERSION}" --locked --force
          fi
          solana-verify --version
      - name: Check the tag against the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' programs/vigilantis/Cargo.toml | head -n 1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match the crate version v${version}"
            exit 1
          fi
      - name: Build in Docker
        run: solana-verify build --library-name vigilantis
      - name: Check the embedded security.txt
        run: bash scripts/check-security-txt.sh target/deploy/vigilantis.so
      # The container writes target/ as root, so the runner cannot add files there: the hashes go
      # to verified/, next to a copy of the program.
      - name: Hash
        run: |
          mkdir -p verified
          cp target/deploy/vigilantis.so verified/vigilantis.so
          hash="$(solana-verify get-executable-hash verified/vigilantis.so)"
          sha="$(sha256sum verified/vigilantis.so | cut -d ' ' -f 1)"
          echo "${hash}" > verified/vigilantis.executable-hash
          echo "${sha}  vigilantis.so" > verified/vigilantis.so.sha256
          echo "Executable hash: ${hash}"
          {
            echo "### Verified build of ${GITHUB_REF_NAME} (${GITHUB_SHA})"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| \`solana-verify get-executable-hash\` | \`${hash}\` |"
            echo "| SHA-256 of the file | \`${sha}\` |"
            echo "| solana-verify | ${SOLANA_VERIFY_VERSION} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: vigilantis-verified-${{ github.ref_name }}-${{ github.sha }}
          path: verified/
          if-no-files-found: error
