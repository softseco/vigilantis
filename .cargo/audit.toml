# cargo audit (CI runs it on Cargo.lock and on tests-fuzz/Cargo.lock). An advisory is ignored here
# only when no semver-compatible fix exists and the affected code is not reached in a way that
# matters; each entry says why. Review at every Solana or LiteSVM upgrade and remove an entry once
# the fix lands.
[advisories]
ignore = [
  # crypto-bigint 0.5.5, timing variability. Only in tests-fuzz/Cargo.lock, through LiteSVM's Solana
  # crates (k256 for secp256k1 recovery). The fuzz harness runs locally with throwaway keys and is
  # not shipped. The fix is in 0.7, which k256 0.13 does not accept.
  "RUSTSEC-2026-0387",
]
