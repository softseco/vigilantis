[workspace]
members = [
    "programs/*"
]
resolver = "2"

# The Agave release whose verifiable-build Docker image `solana-verify build` uses (see
# docs/deployment.md). Keep it the same as SOLANA_VERSION in the CI workflows. Without this line,
# solana-verify picks the image from the solana-program version in Cargo.lock (2.3.0), an older
# toolchain than CI's (see "Build requirements" in CONTRIBUTING.md).
[workspace.metadata.cli]
solana = "4.2.2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
